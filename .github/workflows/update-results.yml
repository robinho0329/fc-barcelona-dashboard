name: Update match results

on:
  schedule:
    - cron: "0 0 * * *" # 09:00 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-match-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download current season
        id: results
        run: |
          python tools/update_results.py
          python tools/update_leaders.py
          if git diff --quiet -- data/raw/SP1_2627.csv; then
            echo "raw_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "raw_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet -- data/raw/SP1_2627.csv data/processed/current_leaders.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild changed data
        if: steps.results.outputs.raw_changed == 'true'
        run: |
          python build_data.py
          python build_managers.py
      - name: Validate data
        run: |
          python tools/test_update_results.py
          python tools/test_update_leaders.py
          python tools/audit.py
      - name: Commit changed data
        if: steps.results.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/SP1_2627.csv data/processed
          git commit -m "Update La Liga match results"
          git push
